# ==============================================================================
# Nutiyala Couture - Nginx Reverse Proxy Configuration
# Place in: /etc/nginx/sites-available/nutiyala.conf
# Enable:   sudo ln -s /etc/nginx/sites-available/nutiyala.conf /etc/nginx/sites-enabled/
# ==============================================================================

# 1. HTTP Server - Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nutiyalacouture.com www.nutiyalacouture.com;

    # Let's Encrypt ACME verification challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Reverse Proxy to Python Application
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nutiyalacouture.com www.nutiyalacouture.com;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/nutiyalacouture.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nutiyalacouture.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nutiyalacouture.com/chain.pem;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Request limits (supports high-resolution product & logo uploads)
    client_max_body_size 15M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Proxy all traffic to Python Backend bound on 127.0.0.1:5173
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Deny access to sensitive files
    location ~* /(\.git|\.env|nutiyala\.db|\.system_generated|backups) {
        deny all;
        return 404;
    }
}
